<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Mister Download Manager — JovianOps Edition">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#06282e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="85%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowLeft)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowRight)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Left Icon Emblem -->
  <g transform="translate(96, 84)">
    <circle cx="76" cy="76" r="68" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="3"/>
    <circle cx="76" cy="76" r="56" fill="#0ea5e9" fill-opacity="0.12"/>
    <!-- Download Arrow -->
    <path d="M76 40 L76 92 M54 72 L76 95 L98 72" fill="none" stroke="url(#accentGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M48 110 L104 110" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Title & Tagline -->
  <g transform="translate(290, 96)">
    <rect x="0" y="-28" width="168" height="26" rx="13" fill="#0ea5e9" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1"/>
    <text x="84" y="-11" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.8" fill="#7dd3fc">JOVIANOPS EDITION</text>

    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8" fill="#f8fafc">Mister Download Manager</text>
    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">Fast, open-source Rust download manager with drag-and-drop workflows.</text>

    <!-- Feature Pills -->
    <g transform="translate(0, 104)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
      <rect x="0" y="0" width="164" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="82" y="20" text-anchor="middle" fill="#e2e8f0">Multi-Part Acceleration</text>

      <rect x="176" y="0" width="118" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="235" y="20" text-anchor="middle" fill="#e2e8f0">Drag &amp; Drop</text>

      <rect x="306" y="0" width="146" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="379" y="20" text-anchor="middle" fill="#e2e8f0">BitTorrent &amp; yt-dlp</text>

      <rect x="464" y="0" width="106" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="517" y="20" text-anchor="middle" fill="#34d399">Rust · GPL-3.0</text>
    </g>
  </g>
</svg>